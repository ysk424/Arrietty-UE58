[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arrietty-ue58"
version = "0.1.0"
description = "UE 5.8 presentation of the accepted Arrietty cycling and flight runtime"
requires-python = ">=3.13"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
include = ["arrietty_up*", "arrietty_ue*"]
